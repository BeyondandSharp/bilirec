#
# bilirec + Rust flvrepair sidecar, single service.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   BILIREC_PORT=9090 DOWNLOADER=ffmpeg FLV_REPAIR=on docker compose -f deploy/docker-compose.yml up
#
# Notes:
# * The image is built from the repo root (context: ..), Dockerfile in deploy/.
# * records/database/secrets are named volumes mounted at the non-root user's
#   writable paths; set the *_DIR variables to use bind mounts instead.
# * Optional API auth: uncomment USERNAME/PASSWORD (PASSWORD is the *bcrypt*
#   hash expected by bilirec's config, see bilirec docs) and set JWT_SECRET.

services:
  bilirec:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOPROXY_URL: ${GOPROXY_URL:-https://goproxy.cn,direct}
        STREAMLINK_VERSION: ${STREAMLINK_VERSION:-8.6.2}
    image: bilirec-rust:${BILIREC_TAG:-dev}
    container_name: bilirec
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${BILIREC_PORT:-8080}:8080"
    # Optional per-host overrides: FEATURES-V2 settings defaults (SEGMENT_*,
    # FILENAME_TEMPLATE, TITLE_FILTER_PATTERNS, SAVE_STREAM_COVER, DANMAKU_*,
    # FLV_*, BILI_*), auth (USERNAME/PASSWORD/VIEWER_*/JWT_SECRET), etc.
    # Copy deploy/.env.example -> deploy/.env first; a missing file is ignored.
    env_file:
      - path: .env
        required: false
    environment:
      # NOTE: keys below have explicit defaults; any of them set in deploy/.env
      # via env_file is overridden by the (same) interpolation values here.
      # FEATURES-V2 settings keys are passed only through env_file, so leaving
      # them unset keeps the built-in defaults (FEATURES-V2 §0).
      # Recording pipeline (docs/INTERFACES.md §2.3). Defaults = native v0.3.1.
      DOWNLOADER: ${DOWNLOADER:-auto}
      DOWNLOADER_FALLBACK: ${DOWNLOADER_FALLBACK:-native}
      FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
      STREAMLINK_BIN: ${STREAMLINK_BIN:-streamlink}
      EXTERNAL_START_TIMEOUT_SECS: ${EXTERNAL_START_TIMEOUT_SECS:-20}
      FLV_REPAIR: ${FLV_REPAIR:-auto}
      FLV_REPAIR_BIN: ${FLV_REPAIR_BIN:-/usr/local/bin/flvrepair}
      FLV_REPAIR_MODE: ${FLV_REPAIR_MODE:-best-effort}
      FLV_REPAIR_MAX_BUFFER_MB: ${FLV_REPAIR_MAX_BUFFER_MB:-64}
      # CORS origins allowed to call the API. The `web` service below serves the
      # frontend on WEB_PORT; add more origins comma-separated behind a proxy.
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:8081}
      # Bilibili login mode: anonymous needs no cookies; see bilirec docs for
      # the controller/login modes.
      BILIBILI_LOGIN_MODE: ${BILIBILI_LOGIN_MODE:-anonymous}
      HOST: 0.0.0.0
      PORT: "8080"
      OUTPUT_DIR: /data/records
      DATABASE_DIR: /data/database
      SECRET_DIR: /data/secrets
      TZ: ${TZ:-UTC}
      # Optional HTTP API auth (leave unset for an open API).
      # USERNAME: ${USERNAME:-}
      # PASSWORD: ${PASSWORD:-}
      # JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - records:/data/records
      - database:/data/database
      - secrets:/data/secrets
      # Bind-mount alternatives:
      # - ${RECORDS_DIR:-./data/records}:/data/records
      # - ${DATABASE_DIR:-./data/database}:/data/database
      # - ${SECRETS_DIR:-./data/secrets}:/data/secrets
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/version', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Self-hosted bilirec-web (React PWA) served by nginx.
  # Open http://<host>:WEB_PORT and enter the backend address
  # (http://<host>:BILIREC_PORT) on the login screen.
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: bilirec-web:${WEB_TAG:-dev}
    container_name: bilirec-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - bilirec

volumes:
  records:
  database:
  secrets:
