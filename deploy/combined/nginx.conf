#
# nginx front door for the all-in-one image (tag `local`).
# - serves the built React PWA from /app/web on :80
# - proxies anything that is not an existing static file to bilirec on
#   127.0.0.1:8080, so the browser talks to the same origin for both the UI and
#   the REST API (no CORS configuration needed).

server {
    listen 80 default_server;
    server_name _;

    root /app/web;
    index index.html;

    # Hashed Vite assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Everything else: static file if present (PWA manifest/sw/icons, etc.),
    # otherwise it is an API request -> bilirec.
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
